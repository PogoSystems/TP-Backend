name: Deploy prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy al VPS
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo '187.127.248.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHxR1PBNqWiEIbkO0EoFdXclwAOGT17rjnQ2/wDBJ+VL' > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/id_ed25519 deploy-tp@187.127.248.194
