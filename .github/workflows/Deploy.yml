name: Deploy prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy al VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Escribimos la clave y limpiamos retornos de carro de Windows con tr -d '\r'
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Registrar el host conocido
          echo '187.127.248.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHxR1PBNqWiEIbkO0EoFdXclwAOGT17rjnQ2/wDBJ+VL' > ~/.ssh/known_hosts

          # Conexión al VPS
          ssh -T -i ~/.ssh/id_ed25519 deploy-tp@187.127.248.194
